<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#2f5bd7"/>
<title>Baseline Assessment — CWSN</title>
<style>
:root{
  --bg:#f2f5fb; --card:#fff; --ink:#141b2b; --muted:#5a6577;
  --line:#dbe2ee; --brand:#2f5bd7; --brand-soft:#e7eefd; --brand-ink:#1f3fa0;
  --ok:#1a7f4b; --ok-soft:#e3f5ea; --warn:#b45309; --warn-soft:#fdf1e0;
  --stop:#b91c1c; --stop-soft:#fdecec; --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;
  -webkit-text-size-adjust:100%;padding-bottom:60px}
h1{font-size:1.6rem;line-height:1.2;margin:.2em 0 .4em}
h2{font-size:1.12rem;margin:0 0 .5em}
h3{font-size:1rem;margin:0 0 .35em}
p{margin:.4em 0}
ul{margin:.3em 0 .3em 1.1em;padding:0}
li{margin:.25em 0}
.muted{color:var(--muted);font-size:.92rem}
.small{font-size:.85rem}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;
  align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.topbar .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);
  display:inline-block;margin-right:8px}
#savenote{font-size:.76rem;color:var(--muted);text-align:right}
#savenote.ok{color:var(--ok)}
#savenote.warn{color:var(--warn)}
.stagebar{position:sticky;top:49px;z-index:19;display:flex;gap:6px;overflow-x:auto;
  padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.stagebar::-webkit-scrollbar{display:none}
.sbtn{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:600;cursor:pointer;
  min-height:38px;white-space:nowrap;font-family:inherit}
.sbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sbtn.done{background:var(--brand-soft);border-color:#c6d6fb;color:var(--brand-ink)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(20,27,43,.04)}
.hero{padding:10px 0 4px}
.kicker{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:800}
.lead{font-size:1.02rem;color:var(--muted)}
.ticks{list-style:none;margin:0;padding:0}
.ticks li{padding-left:26px;position:relative;margin:.45em 0}
.ticks li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 8px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:650;cursor:pointer;
  min-height:50px;transition:.12s;font-family:inherit}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#2549b5}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:8px 13px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.qcard{border-top:1px solid var(--line);padding:16px 0 6px}
.qcard:first-of-type{border-top:0;padding-top:4px}
.qid{font-size:.72rem;font-weight:800;color:var(--brand);letter-spacing:.06em}
.qtext{font-weight:600;margin:2px 0 4px;font-size:1.02rem}
.feeds{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.05em;
  background:var(--brand-soft);color:var(--brand-ink);border-radius:6px;padding:2px 6px;
  margin-left:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;
  padding:10px 15px;font-size:.93rem;font-weight:600;cursor:pointer;min-height:44px;
  font-family:inherit;transition:.12s}
.chip:hover{border-color:#b9c7e6}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  font-size:1rem;font-family:inherit;color:var(--ink);background:#fff;min-height:50px}
.inp:focus{outline:3px solid var(--brand-soft);border-color:var(--brand)}
textarea.inp{min-height:88px;resize:vertical}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.mini{border:1px dashed var(--line);background:transparent;color:var(--muted);
  border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;cursor:pointer;
  min-height:36px;font-family:inherit}
.mini.on{background:var(--warn-soft);border-color:#ecc98f;color:var(--warn);border-style:solid}
.blocked{padding:12px;border-radius:12px;background:#f7f8fb;border:1px dashed var(--line);color:var(--muted)}
.speak{border:0;background:transparent;cursor:pointer;font-size:1.05rem;padding:4px 8px;
  border-radius:8px;line-height:1}
.speak:hover{background:var(--brand-soft)}
.prog{height:8px;background:#e6ebf5;border-radius:99px;overflow:hidden;margin:8px 0}
.prog>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:.25s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.item-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item-row:last-child{border-bottom:0}
.item-name{font-weight:650;flex:1 1 140px}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate .chip{padding:8px 11px;font-size:.82rem;min-height:40px}
.pickbig{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;
  border-radius:14px;padding:16px;font-size:1.05rem;font-weight:650;cursor:pointer;
  margin:0 0 10px;font-family:inherit;min-height:60px}
.pickbig:hover{border-color:var(--brand);background:var(--brand-soft)}
.rankrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rankrow:last-child{border-bottom:0}
.ranknum{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--brand);
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.ranknum.gold{background:#c99a1a}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:8px 14px;padding:6px 0;
  border-bottom:1px solid var(--line);font-size:.94rem}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600}
.alert{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.93rem}
.alert.stop{background:var(--stop-soft);border:1px solid #f3c3c3;color:#7f1d1d}
.alert.warn{background:var(--warn-soft);border:1px solid #f0d5aa;color:#7c4a08}
.alert.ok{background:var(--ok-soft);border:1px solid #b9e3c9;color:#14532d}
.stepbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.step{font-size:.8rem;font-weight:700;color:var(--muted);padding:5px 10px;border-radius:999px;background:#e9eef8}
.step.on{background:var(--brand);color:#fff}
.step.done{background:var(--brand-soft);color:var(--brand-ink)}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;
  letter-spacing:.12em;font-size:1.5rem;background:var(--brand-soft);color:var(--brand-ink);
  border-radius:12px;padding:10px 16px;display:inline-block;margin:6px 0}
@media print{
  body{background:#fff;padding:0}
  .noprint{display:none!important}
  .wrap{max-width:100%;padding:0}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;page-break-inside:avoid}
  .stagebar,.topbar{display:none}
}
</style>
</head>

   ========================================================= */
const state = {
  version: 2,
  createdAt: null,
  updatedAt: null,
  childCode: null,
  sessionId: null,
  seq: 0,
  outbox: [],
  consent: { given:false, research:false, deviceOk:false, explainedStop:false },
  respondent: "caregiver",
  answers: { caregiver:{}, teacher:{} },
  prefs: { items:[], pool:[], order:[], check:{}, notes:"", step:1 },
  probes: { selected:[], results:{}, step:"select" },
  review: { educator:"", role:"", confirmed:false, corrections:"", parentEcho:"", parentNote:"" },
  ui: { stage:"welcome", section:"A1", probeIdx:0, openTier2:false, openTier3:false }
};

function makeChildCode(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = ""; for(let i=0;i<6;i++) s += A[Math.floor(Math.random()*A.length)];
  return s;
}

function ensureShape(){
  if(!state.answers) state.answers = {caregiver:{},teacher:{}};
  if(!state.answers.caregiver) state.answers.caregiver = {};
  if(!state.answers.teacher) state.answers.teacher = {};
  if(!state.prefs) state.prefs = {items:[],pool:[],order:[],check:{},notes:"",step:1};
  if(!state.probes) state.probes = {selected:[],results:{},step:"select"};
  if(!state.review) state.review = {educator:"",role:"",confirmed:false,corrections:"",parentEcho:"",parentNote:""};
  if(!state.ui) state.ui = {stage:"welcome",section:"A1",probeIdx:0,openTier2:false,openTier3:false};
  if(!state.consent) state.consent = {given:false,research:false,deviceOk:false,explainedStop:false};
  if(!Array.isArray(state.outbox)) state.outbox = [];
  if(!state.sessionId) state.sessionId = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  if(!state.childCode){
    const fromLS = (localStorage.getItem(LS_CHILD) || "").toUpperCase();
    state.childCode = /^[A-Z2-9]{6}$/.test(fromLS) ? fromLS : makeChildCode();
  }
  localStorage.setItem(LS_CHILD, state.childCode);
  if(typeof state.seq !== "number") state.seq = 0;
}

function save(){
  state.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ Object.assign(state, JSON.parse(raw)); }
  }catch(e){}
  ensureShape();
  if(!state.createdAt) state.createdAt = new Date().toISOString();
}

/* =========================================================
   SYNC LAYER  — writes events to Apps Script
   ========================================================= */
let flushTimer = null;

function setSyncNote(msg, cls){
  const el = document.getElementById("savenote");
  if(!el) return;
  el.textContent = msg;
  el.className = "small" + (cls ? " " + cls : "");
}

function logEvent(type, payload){
  if(!state.consent.given) { console.log("BLOCKED: Consent not given"); return; }
  if(TEST_MODE) { console.log("BLOCKED: Test mode is active"); return; }
  if(!NET.endpoint || NET.endpoint.indexOf("PASTE_") === 0) { console.log("BLOCKED: Endpoint not configured"); return; }

  state.seq = (state.seq || 0) + 1;
  state.outbox.push(Object.assign({
    eid: state.childCode + "-" + state.sessionId + "-" + state.seq,
    type: type,
    t: Date.now(),
    stage: state.ui.stage
  }, payload || {}));

  console.log("Event logged:", type, "Outbox size:", state.outbox.length);

  if(state.outbox.length >= 20) flush();
  else scheduleFlush();
  save();
}

function scheduleFlush(){
  clearTimeout(flushTimer);
  flushTimer = setTimeout(() => flush(), NET.batchMs);
}

function flush(useBeacon){
  if(!state.consent.given) return;
  if(TEST_MODE) return;
  if(!state.outbox.length) return;
  if(!NET.endpoint || NET.endpoint.indexOf("PASTE_") === 0) return;

  const batch = state.outbox.splice(0, 40);
  const body = JSON.stringify({
    token: NET.token,
    childCode: state.childCode,
    sessionId: state.sessionId,
    respondent: state.respondent,
    appVersion: NET.appVersion,
    events: batch
  });

  const done = ok => {
    if(ok){
      setSyncNote("Saved · synced " + batch.length, "ok");
    } else {
      state.outbox.unshift.apply(state.outbox, batch);
      setSyncNote("Offline — will retry", "warn");
    }
    save();
  };

  // Use the CORS fetch that we just proved works!
  fetch(NET.endpoint, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: body
  })
  .then(res => res.json())
  .then(data => {
    if(data.ok) done(true);
    else done(false);
  })
  .catch(() => done(false));
}  
window.addEventListener("pagehide", () => flush(true));
window.addEventListener("online", () => flush());
setInterval(() => { if(state.outbox.length) flush(); }, 20000);

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}
function ans(qid, resp){
  resp = resp || state.respondent;
  return state.answers[resp][qid] || {};
}
function isAnswered(qid){
  const a = ans(qid);
  if(a.dk || a.na) return true;
  if(Array.isArray(a.v)) return a.v.length > 0;
  return !!(a.v && String(a.v).trim());
}
function getv(qid){
  const a = ans(qid);
  if(a.dk) return "Don’t know";
  if(a.na) return "Not applicable";
  if(Array.isArray(a.v)) return a.v.length ? a.v.join(", ") : null;
  return (a.v && String(a.v).trim()) ? a.v : null;
}
function hasReal(qid){
  const a = ans(qid);
  if(a.dk || a.na) return false;
  if(Array.isArray(a.v)) return a.v.length > 0;
  return !!(a.v && String(a.v).trim());
}
function splitList(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  return String(v).split(/[,;/]/).map(s=>s.trim()).filter(Boolean);
}
function requiredQs(){
  const isT = state.respondent === "teacher";
  return QB.filter(q => isT ? (q.t && q.tier <= 2) : q.tier === 1);
}
function requiredDone(){
  return requiredQs().filter(q => isAnswered(q.id)).length;
}

  {id:"probes",  label:"3 · Skills"},

function render(scrollTop){
  const y = window.scrollY;
  switch(state.ui.stage){
    case "welcome": app.innerHTML = viewWelcome(); break;
    case "consent": app.innerHTML = viewConsent(); break;
    case "intake":  app.innerHTML = viewIntake();  break;
    case "prefs":   app.innerHTML = viewPrefs();   break;
    case "probes":  app.innerHTML = viewProbes();  break;
    case "review":  app.innerHTML = viewReview();  break;
    default:        app.innerHTML = viewWelcome();
  }
  renderStageBar();
  window.scrollTo(0, scrollTop ? 0 : y);
  if(!document.getElementById("savenote").textContent ||
     document.getElementById("savenote").textContent === "Saved on this device"){
    setSyncNote(state.outbox.length
      ? "Saved · " + state.outbox.length + " pending"
      : (state.updatedAt ? "Saved on this device" : "Nothing saved yet"));
  }
}

function renderStageBar(){
  stagebar.innerHTML = STAGES.map(s => {
    const on = state.ui.stage === s.id;
    const done = stageDone(s.id);
    return `<button class="sbtn ${on?"on":(done?"done":"")}" data-act="go" data-to="${s.id}">${esc(s.label)}</button>`;
  }).join("");
}
function stageDone(id){
  if(id === "consent") return state.consent.given;
  if(id === "intake")  return requiredDone() >= requiredQs().length;
  if(id === "prefs")   return (state.prefs.order||[]).length > 0;
  if(id === "probes")  return Object.keys(state.probes.results||{}).length > 0;
  if(id === "review")  return !!(state.review && state.review.confirmed);
  return false;
}

function qCard(q){
  const a = ans(q.id);
  const blocked = a.dk || a.na;
  const isT = state.respondent === "teacher";
  let control = "";

  if(blocked){
    control = `<div class="blocked">${a.dk ? "Marked: don’t know" : "Marked: not applicable"} — tap the chip again to undo.</div>`;
  } else if(q.type === "text"){
    control = `<input class="inp" type="text" data-q="${q.id}" data-f="v"
                 value="${esc(a.v || "")}" placeholder="${esc(q.ph || "Type here")}" autocomplete="off">`;
  } else if(q.type === "date"){
    control = `<input class="inp" type="date" data-q="${q.id}" data-f="v" value="${esc(a.v || "")}">`;
  } else if(q.type === "multi"){
    const arr = Array.isArray(a.v) ? a.v : [];
    control = `<div class="chips">${q.opts.map(o =>
      `<button class="chip ${arr.includes(o)?"on":""}" data-q="${q.id}" data-f="multi" data-opt="${esc(o)}" aria-pressed="${arr.includes(o)}">${esc(o)}</button>`
    ).join("")}</div>`;
  } else {
    control = `<div class="chips">${q.opts.map(o =>
      `<button class="chip ${a.v===o?"on":""}" data-q="${q.id}" data-f="set" data-val="${esc(o)}" aria-pressed="${a.v===o}">${esc(o)}</button>`
    ).join("")}</div>`;
  }

  return `
  <div class="qcard">
    <div class="qid">${esc(q.id)}${q.t ? `<span class="tag">TEACHER TOO</span>` : ``}</div>
    <div class="qtext">${esc(q.q)}
      <button class="speak" data-act="speak" data-text="${esc(q.q)}" title="Read aloud" aria-label="Read question aloud">🔊</button>
    </div>
    <div class="feeds">${esc(q.feeds)}</div>
    ${control}
    <div class="meta-row">
      <button class="mini ${a.dk?"on":""}" data-q="${q.id}" data-f="dk">Don’t know</button>
      <button class="mini ${a.na?"on":""}" data-q="${q.id}" data-f="na">Not applicable</button>
      <button class="mini ${a.note?"on":""}" data-act="note" data-q="${q.id}">Add a note</button>
    </div>
    ${a._showNote
      ? `<textarea class="inp" style="margin-top:8px" data-q="${q.id}" data-f="note" placeholder="Anything else about this?">${esc(a.note||"")}</textarea>`
      : ``}
  </div>`;
}

function prefItems(){
  if(!state.prefs.items || state.prefs.items.length === 0){
    const seen = new Set();
    const out = [];
    const add = (label, src) => {
      const l = String(label||"").trim();
      if(!l) return;
      const k = l.toLowerCase();
      if(seen.has(k)) return;
      seen.add(k);
      out.push({ id:"p" + out.length, label:l, src:src, rating:"" });
    };
    splitList(getv("A7.5")).forEach(x => add(x, "Loves"));
    splitList(getv("A7.3")).forEach(x => add(x, "Loves"));
    splitList(getv("A7.4")).forEach(x => add(x, "Loves"));
    DEFAULT_PREF_ITEMS.forEach(x => add(x, "Common"));
    state.prefs.items = out;
    save();
  }
  return state.prefs.items;
}

function viewPrefs(){
  const p = state.prefs;
  const step = p.step || 1;
  const steps = ["Watch","Rank","Check"];

  const stepper = `

      ${steps.map((s,i)=>`<span class="step ${step===i+1?"on":(step>i+1?"done":"")}">${i+1}. ${esc(s)}</span>`).join("")}

  if(step === 1){
    const items = prefItems();
    return `
    <div class="kicker">Stage 2 · Preference assessment</div>
    <h1>What does your child go to?</h1>
    ${stepper}
    <div class="card">
      <p><strong>Free operant first.</strong> Put a few of these out, sit back for 3 to 5 minutes, and watch. Do not prompt. Record what actually happened.</p>
      <p class="muted small">This is observation, not a test.</p>
    </div>
    <div class="card">
      ${items.map(it => `
        <div class="item-row">
          <div class="item-name">${esc(it.label)}</div>
          <div class="rate">
            ${[["high","Went to it a lot"],["some","A little"],["ignored","Ignored"],["avoided","Avoided"]].map(([r,l])=>
              `<button class="chip ${it.rating===r?"on":""}" data-act="pref-rate" data-id="${it.id}" data-r="${r}">${l}</button>`
            ).join("")}
          </div>
        </div>`).join("")}
      <div class="item-row" style="border-top:1px solid var(--line);margin-top:8px">
        <input class="inp" id="newpref" type="text" placeholder="Add something your child loves…" style="flex:1">
        <button class="btn small" data-act="pref-add">Add</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" data-act="pref-step" data-n="2">Next: rank the top few</button>
    </div>`;
  }

  if(step === 2){
    const items = prefItems();
    const rated = items.filter(i => i.rating === "high" || i.rating === "some");
    const pool = p.pool || [];
    const suggestions = (rated.length ? rated : items).slice(0, 8);

    return `
    <div class="kicker">Stage 2 · Preference assessment</div>
    <h1>Pick up to 5 to rank</h1>
    ${stepper}
    <div class="card">
      <p>Choose the items that got the strongest reaction. We will run a short <strong>MSWO</strong> — the child picks one, it is removed, they pick again.</p>
      <p class="muted small">${pool.length} of 5 selected. Pick at least 2.</p>
      <div class="chips">
        ${suggestions.map(it =>
          `<button class="chip ${pool.includes(it.id)?"on":""}" data-act="pref-pool" data-id="${it.id}">${esc(it.label)}</button>`
        ).join("")}
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" data-act="pref-step" data-n="1">Back</button>
      <button class="btn primary" data-act="pref-startrank" ${pool.length>=2?"":"disabled"}>Start ranking</button>
    </div>`;
  }

  if(step === 3){
    const pool = p.pool || [];
    const order = p.order || [];
    const remaining = pool.filter(id => !order.includes(id));
    const items = prefItems();
    const label = id => (items.find(i => i.id === id) || {label:"?"}).label;

    if(remaining.length <= 0){
      return `
      <div class="kicker">Stage 2 · Preference assessment</div>
      <h1>Ranking done</h1>
      ${stepper}
      <div class="card">
        ${order.map((id,i)=>`
          <div class="rankrow">
            <div class="ranknum ${i===0?"gold":""}">${i+1}</div>
            <div style="flex:1;font-weight:650">${esc(label(id))}</div>
          </div>`).join("")}
      </div>
      <div class="actions">
        <button class="btn ghost" data-act="pref-reset-rank">Start ranking again</button>
        <button class="btn primary" data-act="pref-step" data-n="4">Next: check the top three</button>
      </div>`;
    }

    return `
    <div class="kicker">Stage 2 · Preference assessment</div>
    <h1>Trial ${order.length + 1}</h1>
    ${stepper}
    <div class="card">
      <p><strong>Put these out together.</strong> Let your child take one. Tap the one they took.</p>
      <p class="muted small">Do not guide their hand. If they take none after 30 seconds, mark “no pick”.</p>
      ${remaining.map(id=>`<button class="pickbig" data-act="mswao-pick" data-id="${id}">${esc(label(id))}</button>`).join("")}
      <button class="btn small ghost" data-act="mswao-pick" data-id="__none">No pick this time</button>
    </div>`;
  }

  const order = (p.order || []).filter(id => id !== "__none");
  const top3 = order.slice(0, 3);
  const items = prefItems();
  const label = id => (items.find(i => i.id === id) || {label:"?"}).label;
  const avoids = (items.filter(i => i.rating === "avoided").map(i=>i.label))
    .concat(splitList(getv("A7.8")));

  return `
  <div class="kicker">Stage 2 · Preference assessment</div>
  <h1>Quick reinforcer check</h1>
  ${stepper}
  <div class="card">
    <p>Offer each one briefly, on its own. Does it still work?</p>
    ${top3.map(id=>`
      <div class="item-row">
        <div class="item-name">${esc(label(id))}</div>
        <div class="rate">
          ${[["still","Still wants it"],["lost","Lost interest"],["refused","Refused"]].map(([r,l])=>
            `<button class="chip ${p.check[id]===r?"on":""}" data-act="pref-check" data-id="${id}" data-r="${r}">${l}</button>`
          ).join("")}
        </div>
      </div>`).join("") || `<p class="muted">No items were ranked.</p>`}
  </div>

  <div class="card">
    <h2>Reinforcer menu</h2>
    <p>${top3.map((id,i)=>`<strong>${i+1}.</strong> ${esc(label(id))}`).join(" &nbsp;·&nbsp; ") || `<span class="muted">Not enough data yet.</span>`}</p>
    ${avoids.length ? `<div class="alert warn"><strong>Avoid list:</strong> ${esc(avoids.join(", "))}</div>` : ``}
    <textarea class="inp" data-act="pref-notes" placeholder="Notes from the preference sessions…">${esc(p.notes||"")}</textarea>
  </div>

  <div class="actions">
    <button class="btn ghost" data-act="pref-step" data-n="3">Back</button>
    <button class="btn primary" data-act="go" data-to="probes">Next: skill probing</button>
  </div>`;
}

/* =========================================================
   VIEW — Stage 3 skill probing
   ========================================================= */
function suggestProbes(){
  const s = new Set();
  const count = getv("A6.3");
  if(!count || count === "Not yet" || count === "Up to 2") s.add("N5");
  if(count === "Up to 2" || count === "Up to 3") s.add("N6");
  if(count === "Up to 5" || count === "Up to 10" || count === "More than 10") { s.add("N6"); s.add("N7"); }
  if(hasReal("A6.4")) s.add("N12");
  if(hasReal("A6.8")) { s.add("N9"); s.add("O7"); }
  if(hasReal("A6.6")) s.add("M2");
  if(hasReal("A6.5")) { s.add("M1"); s.add("M4"); }
  if(hasReal("A6.2")) { s.add("T1"); s.add("T2"); }
  if(hasReal("A6.7")) s.add("T3");
  if(s.size === 0){ ["N5","N6","M2","T1"].forEach(x=>s.add(x)); }
  return Array.from(s);
}

function derivedSettings(){
  const out = [];
  const g = id => getv(id);

  const vocab = g("A2.2");
  let promptLen = "Start with 1 to 2 words plus a picture.";
  if(vocab === "None") promptLen = "No spoken words. Use a single picture or sound cue, one at a time.";
  else if(vocab === "1 to 10") promptLen = "1 to 2 word prompts with a picture. Never a full sentence.";
  else if(vocab === "10 to 50") promptLen = "Short 2 to 3 word phrases with a picture.";
  else if(vocab === "50 or more" || vocab === "Sentences") promptLen = "Short full sentences are fine.";
  out.push(["Prompt length", promptLen]);

  const ch = g("A2.6");
  let choices = "2 choices to start; single card if unsure.";
  if(ch === "Not yet") choices = "1 item at a time only. No choice screens yet.";
  else if(ch === "Three or four") choices = "3 to 4 choices on screen.";
  else if(ch === "More than four") choices = "Up to 6 choices, but never more than 4 at once on a busy screen.";
  out.push(["Choices on screen", choices]);

  const wait = g("A2.10");
  if(wait) out.push(["Wait time after a question", wait]);

  const att = g("A5.1a");
  if(att) out.push(["Session length", att + " per block, then a break."]);

  const sound = g("A4.1");
  if(sound) out.push(["Sound", sound === "Gets upset" ? "Sound off by default. No sudden or loud effects." : sound === "Seeks them out" ? "Sound can be on; use it as a reward." : "Gentle sound, always with a mute option."]);

  const density = g("A4.5");
  if(density) out.push(["Screen density", density === "Often" || density === "Always" ? "One item per screen, plain background, no animation." : "Simple layout; keep decoration minimal."]);

  const vision = g("A3.1");
  if(vision === "Yes" || vision === "Sometimes") out.push(["Size and contrast", "Large, high-contrast targets. No low-contrast greys."]);

  const touch = g("A3.3");
  if(touch === "No") out.push(["Input", "Large targets, or a switch / adult-assisted touch."]);
  else if(touch === "Sometimes") out.push(["Input", "Large targets (min 64px) and generous spacing."]);

  const input = g("A3.5");
  if(input && input !== "None") out.push(["Input aid", input]);

  const order = (state.prefs.order || []).filter(x => x !== "__none").slice(0, 3);
  if(order.length){
    const items = state.prefs.items || [];
    const labels = order.map(id => (items.find(i => i.id === id) || {}).label).filter(Boolean);
    if(labels.length) out.push(["Reinforcers", labels.join(" → ")]);
  }

  return out;
}

document.addEventListener("click", (e) => {
  const chip = e.target.closest("button[data-f]");
  if(chip && chip.dataset.q){ e.preventDefault(); handleAnswerChip(chip); return; }

  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;

  if(act === "go"){
    const to = el.dataset.to;
    if(to === "intake" && !state.consent.given && state.ui.stage !== "intake"){
      state.ui.stage = "consent";
    } else {
      state.ui.stage = to;
    }
    logEvent("stage", { val: to });
    save(); render(true); return;
  }

  if(act === "resp"){
    state.respondent = el.dataset.id;
    state.ui.section = "A1";
    logEvent("respondent", { val: state.respondent });
    save(); render(true); return;
  }

  if(act === "section"){
    state.ui.section = el.dataset.id;
    save(); render(true); return;
  }

  if(act === "nextsec" || act === "prevsec"){
    const isT = state.respondent === "teacher";
    const secs = SECS.filter(s => {
      if(s.teacherOnly && !isT) return false;
      return QB.some(q => q.s === s.id && (!isT || q.t));
    });
    const i = secs.findIndex(s => s.id === state.ui.section);
    const n = act === "nextsec" ? i + 1 : i - 1;
    if(n >= secs.length){ state.ui.stage = "prefs"; }
    else if(n < 0){ state.ui.stage = "welcome"; }
    else { state.ui.section = secs[n].id; }
    logEvent("stage", { val: state.ui.stage });
    save(); render(true); return;
  }

  if(act === "tier"){
    if(el.dataset.n === "2") state.ui.openTier2 = !state.ui.openTier2;
    else state.ui.openTier3 = !state.ui.openTier3;
    save(); render(); return;
  }

  if(act === "note"){
    const qid = el.dataset.q;
    const a = ans(qid);
    a._showNote = !a._showNote;
    save(); render(); return;
  }

  if(act === "consent"){
    const k = el.dataset.k;
    state.consent[k] = !state.consent[k];
    if(k === "given" && state.consent.given){
      logEvent("consent", { val: { given:true, research: state.consent.research } });
    }
    save(); render(); return;
  }

  if(act === "speak"){
    e.preventDefault(); speak(el.dataset.text); return;
  }

  if(act === "change-code"){
    const v = (prompt("Enter the child code your tutor gave you (6 letters or numbers):") || "").trim().toUpperCase();
    if(!v) return;
    if(!/^[A-Z2-9]{6}$/.test(v)){ alert("Please enter exactly 6 letters or numbers."); return; }
    state.childCode = v;
    localStorage.setItem(LS_CHILD, v);
    save(); render(true); return;
  }

  /* preferences */
  if(act === "pref-rate"){
    const it = prefItems().find(x => x.id === el.dataset.id);
    if(it){ it.rating = (it.rating === el.dataset.r) ? "" : el.dataset.r; }
    logEvent("pref-rate", { qid: el.dataset.id, val: it ? it.rating : "" });
    save(); render(); return;
  }
  if(act === "pref-add"){
    const input = document.getElementById("newpref");
    const v = input && input.value.trim();
    if(v){
      const items = prefItems();
      items.push({id:"p" + (Date.now() % 100000), label:v, src:"Added", rating:"high"});
      logEvent("pref-add", { val: v });
      save();
    }
    render(); return;
  }
  if(act === "pref-pool"){
    const id = el.dataset.id;
    const pool = state.prefs.pool || [];
    const i = pool.indexOf(id);
    if(i >= 0) pool.splice(i,1); else if(pool.length < 5) pool.push(id);
    state.prefs.pool = pool;
    state.prefs.order = [];
    logEvent("pref-pool", { val: pool });
    save(); render(); return;
  }
  if(act === "pref-startrank"){
    state.prefs.order = [];
    state.prefs.step = 3;
    save(); render(true); return;
  }
  if(act === "mswao-pick"){
    const id = el.dataset.id;
    state.prefs.order = state.prefs.order || [];
    state.prefs.order.push(id === "__none" ? "__none" : id);
    const remaining = (state.prefs.pool || []).filter(x => !state.prefs.order.includes(x));
    if(remaining.length === 1) state.prefs.order.push(remaining[0]);
    logEvent("pref-pick", { val: id });
    save(); render(); return;
  }
  if(act === "pref-reset-rank"){
    state.prefs.order = [];
    state.prefs.step = 2;
    save(); render(true); return;
  }
  if(act === "pref-step"){
    state.prefs.step = Number(el.dataset.n);
    save(); render(true); return;
  }
  if(act === "pref-check"){
    state.prefs.check = state.prefs.check || {};
    const id = el.dataset.id;
    state.prefs.check[id] = (state.prefs.check[id] === el.dataset.r) ? "" : el.dataset.r;
    logEvent("pref-check", { qid: id, val: state.prefs.check[id] });
    save(); render(); return;
  }

  /* probes */
  if(act === "probe-toggle"){
    const id = el.dataset.id;
    const sel = state.probes.selected || [];
    const i = sel.indexOf(id);
    if(i >= 0) sel.splice(i,1); else sel.push(id);
    state.probes.selected = sel;
    logEvent("probe-select", { val: sel });
    save(); render(); return;
  }
  if(act === "probe-suggest"){
    state.probes.selected = suggestProbes();
    logEvent("probe-suggest", { val: state.probes.selected });
    save(); render(); return;
  }
  if(act === "probe-start"){
    if(!(state.probes.selected || []).length) return;
    state.probes.step = "run";
    state.ui.probeIdx = 0;
    save(); render(true); return;
  }
  if(act === "probe-back"){
    state.probes.step = "select";
    save(); render(true); return;
  }
  if(act === "probe-pick"){
    state.probes.results = state.probes.results || {};
    const id = el.dataset.id;
    state.probes.results[id] = (state.probes.results[id] === el.dataset.r) ? "" : el.dataset.r;
    logEvent("probe-result", { qid: id, val: state.probes.results[id] });
    save(); render(); return;
  }
  if(act === "probe-prev"){
    state.ui.probeIdx = Math.max(0, (state.ui.probeIdx||0) - 1);
    save(); render(true); return;
  }
  if(act === "probe-next"){
    const list = PROBES.filter(pr => (state.probes.selected||[]).includes(pr.id));
    if((state.ui.probeIdx||0) >= list.length - 1){
      state.ui.stage = "review";
      logEvent("stage", { val: "review" });
    } else {
      state.ui.probeIdx = (state.ui.probeIdx||0) + 1;
    }
    save(); render(true); return;
  }

  /* review */
  if(act === "review-toggle"){
    state.review[el.dataset.k] = !state.review[el.dataset.k];
    logEvent("review", { qid: el.dataset.k, val: state.review[el.dataset.k] });
    save(); render(); return;
  }

  if(act === "submit"){
    logEvent("snapshot", { val: JSON.stringify({
      answers: state.answers, prefs: state.prefs,
      probes: state.probes, review: state.review,
      consent: state.consent, respondent: state.respondent
    })});
    logEvent("submit", { val: "review" });
    flush(true);
    setSyncNote("Sent to tutor ✓", "ok");
    setTimeout(() => { setSyncNote("Saved on this device"); }, 4000);
    return;
  }

  if(act === "print"){ window.print(); return; }

  if(act === "reset"){
    if(confirm("Delete all answers on this device? This cannot be undone.")){
      localStorage.removeItem(KEY);
      location.reload();
    }
    return;
  }
});

/* text/textarea — debounced logging on input */
const inputTimers = {};
document.addEventListener("input", (e) => {
  const el = e.target;

  if(el.matches("input[data-f='v']") || el.matches("textarea[data-f='v']") || el.matches("textarea[data-f='note']")){
    const qid = el.dataset.q;
    const resp = state.respondent;
    const a = state.answers[resp][qid] || (state.answers[resp][qid] = {v:null});
    if(el.dataset.f === "note") a.note = el.value;
    else a.v = el.value;
    save();
    clearTimeout(inputTimers[qid]);
    inputTimers[qid] = setTimeout(() => {
      logEvent("answer", { qid, val: el.dataset.f === "note" ? a.note : a.v });
    }, 1500);
    return;
  }

  if(el.dataset.act === "pref-notes"){
    state.prefs.notes = el.value;
    save();
    clearTimeout(inputTimers.prefNotes);
    inputTimers.prefNotes = setTimeout(() => {
      logEvent("pref-note", { val: state.prefs.notes });
    }, 1500);
    return;
  }

  if(el.dataset.act === "review"){
    state.review[el.dataset.k] = el.value;
    save();
    const k = el.dataset.k;
    clearTimeout(inputTimers["rev_" + k]);
    inputTimers["rev_" + k] = setTimeout(() => {
      logEvent("review", { qid: k, val: state.review[k] });
    }, 1500);
    return;
  }
});

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act='review'][data-val]");
  if(!el) return;
  const k = el.dataset.k, v = el.dataset.val;
  state.review[k] = (state.review[k] === v) ? "" : v;
  logEvent("review", { qid: k, val: state.review[k] });
  save(); render();
}, true);

function handleAnswerChip(el){
  const qid = el.dataset.q;
  const resp = state.respondent;
  const store = state.answers[resp];
  const a = store[qid] || (store[qid] = { v:null });
  const f = el.dataset.f;

  if(f === "set"){
    a.v = (a.v === el.dataset.val) ? null : el.dataset.val;
    a.dk = false; a.na = false;
  } else if(f === "multi"){
    const opt = el.dataset.opt;
    if(!Array.isArray(a.v)) a.v = [];
    const i = a.v.indexOf(opt);
    if(i >= 0) a.v.splice(i,1); else a.v.push(opt);
    a.dk = false; a.na = false;
  } else if(f === "dk"){
    a.dk = !a.dk;
    if(a.dk){ a.na = false; a.v = null; }
  } else if(f === "na"){
    a.na = !a.na;
    if(a.na){ a.dk = false; a.v = null; }
  }
  logEvent("answer", { qid, val: {v: a.v, dk: a.dk, na: a.na} });
  save(); render();
}

function speak(text){
  if(!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

/* =========================================================
   BOOT
   ========================================================= */
load();
render(true);
</script>
